# Render Blueprint for the TracePay API.
# The database is Neon (serverless Postgres); the web app (apps/web) is on Vercel.
services:
  - type: web
    name: tracepay-api
    runtime: node
    # Same AWS region as the Neon database (us-east-2 / Ohio): every query is a
    # network round trip, and transactions hold locks across them.
    region: ohio
    # Free sleeps after 15 idle minutes (the first request then takes ~1 minute).
    # Switch to starter for an always-on API, e.g. while judging is open.
    plan: free
    # --include=dev: NODE_ENV=production (below) also applies to the build, and would
    # make npm skip the build tools (prisma, tsup, typescript).
    buildCommand: npm ci --include=dev && npm run build -w @tracepay/api
    # Apply migrations (over DATABASE_URL_UNPOOLED), then start. Seed the demo data once, from your
    # machine or the Render shell: npm run db:seed -w @tracepay/api (it refuses to run
    # once real accounts exist).
    startCommand: npm run db:deploy -w @tracepay/api && npm run start -w @tracepay/api
    # Liveness only. /api/ready also queries the database; pointing Render's frequent
    # health checks at it would keep Neon's compute from ever suspending.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production # also makes session cookies Secure
      # Hackathon judging: keep the demo role switcher on. Set to "false" for real users.
      - key: DEMO_MODE
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: AUTH_RATE_LIMIT
        value: "20"
      # Trust only Render's own proxy. (Trusting 2 hops would let a client calling the
      # Render URL directly spoof X-Forwarded-For and dodge rate limits.) Per-account
      # login limits and per-user quotas cover the case where Vercel traffic shares IPs.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The real visitor IP for rate limits. Render's proxy chain has several hops (so
      # TRUST_PROXY_HOPS alone made all visitors share one limit); Cloudflare sets this
      # header at Render's edge and overwrites any client-supplied value.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: LOG_LEVEL
        value: info
      # Neon → Connect: the POOLED string (host contains "-pooler"), with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon → Connect with "Connection pooling" off: the DIRECT string, used for migrations.
      # (`neon env pull` writes both under these names.)
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: APP_BASE_URL
        sync: false # the Vercel site: https://trace-pay-umber.vercel.app
      - key: API_BASE_URL
        sync: false # this service's URL
      - key: CORS_ORIGINS
        sync: false # https://trace-pay-umber.vercel.app (comma-separate several)
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      - key: VERTEX_MODEL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false # base64 of the service-account key file
      - key: WEBHOOK_SECRET_KEY
        sync: false # 32 random bytes, base64: encrypts webhook signing secrets at rest
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: AUDIT_SIGNING_PRIVATE_KEY
        sync: false # npm run keys:generate -w @tracepay/api
      - key: DEMO_PAYEE_EMAILS
        sync: false # sandbox personal accounts: Northwind,Okafor,Lumen
