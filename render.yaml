# Render Blueprint for the TracePay API.
# The database is Neon (serverless Postgres); the web app (apps/web) is on Vercel.
# Render runs the API and a Key Value instance that holds the rate-limit counters,
# so limits and quotas hold across every instance (scale the API out freely).
services:
  - type: web
    name: tracepay-api
    runtime: node
    # Same AWS region as the Neon database (us-east-2 / Ohio): every query is a
    # network round trip, and transactions hold locks across them.
    region: ohio
    # Free sleeps after 15 idle minutes (the first request then takes ~1 minute).
    # Switch to starter for an always-on API, e.g. while judging is open.
    plan: free
    # --include=dev: NODE_ENV=production (below) also applies to the build, and would
    # make npm skip the build tools (prisma, tsup, typescript).
    # Migrations (over DATABASE_URL_UNPOOLED) run once per deploy, in the build: a failing
    # migration fails the build and the running version keeps serving, and waking a sleeping
    # free instance doesn't pay for the Prisma CLI. Migrations are additive, so the version
    # still serving keeps working against the new schema. Seed the demo data once, from your
    # machine or the Render shell: npm run db:seed -w @tracepay/api (it refuses to run
    # once real accounts exist).
    buildCommand: npm ci --include=dev && npm run build -w @tracepay/api && npm run db:deploy -w @tracepay/api
    startCommand: npm run start -w @tracepay/api
    # Liveness only. /api/ready also queries the database; pointing Render's frequent
    # health checks at it would keep Neon's compute from ever suspending.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production # also makes session cookies Secure
      # Hackathon judging: keep the demo role switcher on. Set to "false" for real users.
      - key: DEMO_MODE
        value: "true"
      # Every judge shares the demo buyer: it may buy a report again and its demo credit
      # refills, so each visitor can try PayPal checkout and AI answers. Remove for real users.
      - key: DEMO_SHARED_BUYER
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: AUTH_RATE_LIMIT
        value: "20"
      # Trust only Render's own proxy. (Trusting 2 hops would let a client calling the
      # Render URL directly spoof X-Forwarded-For and dodge rate limits.) Per-account
      # login limits and per-user quotas cover the case where Vercel traffic shares IPs.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The real visitor IP for rate limits. Render's proxy chain has several hops (so
      # TRUST_PROXY_HOPS alone made all visitors share one limit); Cloudflare sets this
      # header at Render's edge and overwrites any client-supplied value.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: LOG_LEVEL
        value: info
      # Shared rate-limit counters, over Render's private network. Limits fail open
      # (and /api/ready reports it) if the Key Value instance is ever unreachable.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tracepay-limits
          property: connectionString
      # Neon → Connect: the POOLED string (host contains "-pooler"), with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon → Connect with "Connection pooling" off: the DIRECT string, used for migrations.
      # (`neon env pull` writes both under these names.)
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: APP_BASE_URL
        sync: false # the Vercel site: https://trace-pay-umber.vercel.app
      - key: API_BASE_URL
        sync: false # this service's URL
      - key: CORS_ORIGINS
        sync: false # https://trace-pay-umber.vercel.app (comma-separate several)
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_HINT
        sync: false # demo mode only: sandbox buyer login shown on the Store page
      - key: GEMINI_API_KEY
        sync: false # from aistudio.google.com/apikey; or use the Vertex AI keys below
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      - key: VERTEX_MODEL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false # base64 of the service-account key file
      - key: TRUSTED_PROXY_SECRET
        sync: false # same value as the Vercel env TRACEPAY_PROXY_SECRET
      - key: WEBHOOK_SECRET_KEY
        sync: false # 32 random bytes, base64: encrypts webhook signing secrets at rest
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: AUDIT_SIGNING_PRIVATE_KEY
        sync: false # npm run keys:generate -w @tracepay/api
      - key: DEMO_PAYEE_EMAILS
        sync: false # sandbox personal accounts: Northwind,Okafor,Lumen
      - key: GEMINI_MODEL
        sync: false # optional: defaults to gemini-flash-latest with GEMINI_API_KEY
      - key: DB_POOL_MAX
        value: "10"
      # Pay-per-citation answers (defaults in apps/api/.env.example; demo mode pays out at once).
      - key: ANSWER_FEE_CENTS
        value: "2"
      - key: ROYALTY_PAYOUT_MIN_CENTS
        sync: false # default 100 (1 in demo mode)
      - key: CREDIT_CLEARING_DAYS
        sync: false # default 14 (0 in demo mode): refunds/chargebacks land before payouts

  # Rate-limit counters only: losing them on a restart just restarts the windows,
  # so the free plan (no persistence) fits. Reachable only from inside Render.
  - type: keyvalue
    name: tracepay-limits
    region: ohio
    plan: free
    maxmemoryPolicy: volatile-lru # every counter carries an expiry
    ipAllowList: []
