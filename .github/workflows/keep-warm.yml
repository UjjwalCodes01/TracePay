# An outside check that the hosted demo is up while the hackathon is judged. The demo runs on
# Google Cloud Run with one instance always warm, so this doesn't keep anything awake: it fails
# (and GitHub emails the owner) if the site stops answering. /api/health never touches the
# database. Stops by itself after judging ends.
name: Demo uptime check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the demo while judging is open
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261231 ]; then echo "Judging is over; nothing to do."; exit 0; fi
          curl -fsS --max-time 30 --retry 2 --retry-delay 20 https://tracepay-886254253714.us-east5.run.app/api/health
