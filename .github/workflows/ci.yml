name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracepay
          POSTGRES_PASSWORD: tracepay
          POSTGRES_DB: tracepay
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tracepay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Dependency audit (high and above fails the build)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck -w @tracepay/api && npm run typecheck -w @tracepay/web && npm run typecheck -w @tracepay/mcp
      - name: Unit + integration tests with a coverage floor (real Postgres + Redis, in-memory PayPal fake)
        run: npm run test:coverage -w @tracepay/api
      - name: The database schema matches its migrations
        run: npm run db:check-drift -w @tracepay/api
      - name: Build
        run: npm run build -w @tracepay/api && npm run build -w @tracepay/web
      - name: Browser tests of the web app (every page and role, phones, accessibility, the paid-answer flow)
        run: npm run test:e2e -w @tracepay/api
