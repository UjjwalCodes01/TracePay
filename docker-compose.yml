services:
  db:
    image: postgres:17-alpine
    # Come back after a reboot or Docker restart, so local dev and tests just work.
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracepay
      POSTGRES_PASSWORD: tracepay
      POSTGRES_DB: tracepay
    ports:
      - "5433:5432"
    volumes:
      - tracepay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Shared rate-limit counters (Render Key Value in production). Optional for dev:
  # without REDIS_URL the API counts in memory.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  tracepay-db:
