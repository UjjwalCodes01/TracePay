# Builds the TracePay image in Google Cloud Build, tagged with the commit it was built from.
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_COMMIT=$(git rev-parse --short HEAD)
substitutions:
  _IMAGE: us-east5-docker.pkg.dev/tracepay-ai-1023775/tracepay/tracepay
  _COMMIT: unknown
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'COMMIT=${_COMMIT}', '-t', '${_IMAGE}:${_COMMIT}', '-t', '${_IMAGE}:latest', '.']
images: ['${_IMAGE}:${_COMMIT}', '${_IMAGE}:latest']
timeout: 1800s
